<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="Booked In">
  <!-- The home-screen and share icon: favicon.svg with the corners left
       square, because iOS and Android apply their own mask and rounding it
       here would round it twice.

       Android's maskable mask can crop to the central 80% of the tile, which
       at this size is a radius of 12.8. The ring paints out to 13.0, so the
       mark is scaled to 0.945 to bring it inside that safe zone; the tile
       itself bleeds to the edge and has nothing to lose. Rasterised by
       scripts/build-icons.cjs. -->
  <rect width="32" height="32" fill="#B8465C"/>
  <g transform="translate(16 16) scale(.945) translate(-16 -16)">
   <g transform="rotate(-90 16 16)" fill="none" stroke-linecap="round" stroke="#FDFAFA">
     <circle cx="16" cy="16" r="10.5" stroke-width="5" stroke-opacity=".38"
             stroke-dasharray="3.996 7.000"/>
     <circle cx="16" cy="16" r="10.5" stroke-width="5"
             stroke-dasharray="3.996 61.978" stroke-dashoffset="-21.991"/>
   </g>
  </g>
</svg>
