<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your appointment</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FDFAFA">
<link rel="icon" href="../site/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app/app.css">
<style>
.page{width:100%; max-width:460px; margin:0 auto; padding:var(--s-60) var(--s-25) var(--s-80)}
.page > img{width:38px; height:38px; margin:0 auto var(--s-30)}
.lead{text-align:center; margin-bottom:var(--s-40)}
.lead h1{font-family:"Bodoni Moda",Georgia,serif; font-size:var(--t-3); color:var(--plum)}
.lead p{color:var(--ink-faint); font-size:var(--t-sm); margin-top:var(--s-10)}
.detail{display:flex; flex-direction:column; gap:var(--s-20)}
.detail div{display:flex; gap:var(--s-20); align-items:baseline}
.detail dt{
  flex:none; width:104px; font-size:var(--t-xs); font-weight:700; text-transform:uppercase;
  letter-spacing:var(--ls-caps); color:var(--ink-faint);
}
.detail dd{margin:0; font-weight:600; color:var(--plum)}
.state{
  display:inline-block; padding:5px var(--s-20); border-radius:var(--r-pill);
  font-size:var(--t-xs); font-weight:700; text-transform:uppercase; letter-spacing:.08em;
}
.state.on{background:var(--petal); color:var(--carmine)}
.state.off{background:var(--line); color:var(--ink-faint)}
.note{
  margin-top:var(--s-30); padding:var(--s-20) var(--s-25); border-radius:var(--r-md);
  background:var(--petal); border:1px solid var(--line);
  font-size:var(--t-sm); color:var(--ink-soft); line-height:var(--lh-ui);
}
@media (max-width:389px){
  .page{padding-inline:var(--s-20)} .card{padding:var(--s-25)}
  .detail div{flex-direction:column; gap:var(--s-5)} .detail dt{width:auto}
}
</style>
</head>
<body>
<div class="page">
  <img src="../site/logo.svg" alt="">
  <div id="boot" style="text-align:center"><p class="muted">One moment…</p></div>

  <div id="gone" hidden class="lead">
    <h1>We cannot find that</h1>
    <p>The link may be incomplete. Check the one in your confirmation email, or message the studio.</p>
  </div>

  <main id="main" hidden>
    <div class="lead">
      <h1 id="title">Your appointment</h1>
      <p id="studio"></p>
    </div>
    <div class="card">
      <dl class="detail">
        <div><dt>When</dt><dd id="d-when"></dd></div>
        <div><dt>Treatment</dt><dd id="d-what"></dd></div>
        <div><dt>Price</dt><dd id="d-cost"></dd></div>
        <div><dt>Reference</dt><dd id="d-ref"></dd></div>
        <div><dt>Status</dt><dd><span class="state" id="d-state"></span></dd></div>
      </dl>
      <div id="act" style="margin-top:var(--s-40)">
        <button class="btn btn-ghost btn-block" id="cancel">Cancel this appointment</button>
      </div>
      <p class="note" id="why" hidden></p>
    </div>
    <p class="muted" style="text-align:center; margin-top:var(--s-30)">
      Changed your mind about the time? Cancel here, then <a id="rebook" href="#">book another</a>.</p>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../platform/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";
  var cfg = window.BOOKEDIN || {};
  var $ = function(id){ return document.getElementById(id); };
  var sb = null, bk = null, ref = null, token = null, toastT = null;

  function say(m, bad){
    var t = $("toast");
    t.textContent = m; t.classList.toggle("bad", !!bad); t.classList.add("up");
    clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("up"); }, 4200);
  }
  function tz(){ return (bk && bk.timezone) || "Europe/London"; }
  function when(iso){
    return new Intl.DateTimeFormat("en-GB", { timeZone:tz(), weekday:"long", day:"numeric",
      month:"long", hour:"2-digit", minute:"2-digit", hour12:false }).format(new Date(iso));
  }
  function money(p){ return "£" + (p % 100 === 0 ? p/100 : (p/100).toFixed(2)); }
  function lost(){ $("boot").hidden = true; $("gone").hidden = false; }

  function paint(){
    $("studio").textContent = bk.studio;
    $("d-when").textContent = when(bk.starts_at);
    $("d-what").textContent = bk.service;
    $("d-cost").textContent = money(bk.price_pence);
    $("d-ref").textContent  = bk.ref;
    var st = $("d-state");
    st.textContent = bk.status === "confirmed" ? "Booked" : "Cancelled";
    st.className = "state " + (bk.status === "confirmed" ? "on" : "off");
    $("rebook").href = "./?s=" + encodeURIComponent(bk.slug);

    $("act").hidden = !bk.can_cancel;
    var why = $("why");
    if(bk.can_cancel){ why.hidden = true; return; }
    why.hidden = false;
    why.textContent = bk.status === "cancelled"
      ? "This appointment is cancelled. Nothing more to do — book another whenever you like."
      : "It is now too close to your appointment to cancel here. Please message " +
        bk.studio + " directly so she can fill the time.";
  }

  function boot(){
    if(!cfg.SUPABASE_URL || cfg.SUPABASE_URL.indexOf("PASTE") === 0){
      $("boot").innerHTML = '<p class="muted">Not connected to a database yet.</p>'; return;
    }
    var q = new URLSearchParams(location.search);
    ref = q.get("r"); token = q.get("t");
    if(!ref || !token){ lost(); return; }
    sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    sb.rpc("get_booking", { p_ref: ref, p_token: token }).then(function(res){
      if(res.error || !res.data){ lost(); return; }
      bk = res.data;
      document.title = "Your appointment with " + bk.studio;
      paint();
      $("boot").hidden = true;
      $("main").hidden = false;
    });
  }

  $("cancel").addEventListener("click", function(){
    if(!confirm("Cancel your appointment on " + when(bk.starts_at) + "?")) return;
    var b = $("cancel");
    b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    sb.rpc("cancel_booking", { p_ref: ref, p_token: token }).then(function(res){
      b.disabled = false; b.textContent = "Cancel this appointment";
      if(res.error){ say(res.error.message, true); return; }
      say("Cancelled. The studio has been told.");
      /* re-read rather than patch the object: the window may have closed while
         this page sat open, and the server is the one that decides */
      return sb.rpc("get_booking", { p_ref: ref, p_token: token }).then(function(r2){
        if(!r2.error && r2.data){ bk = r2.data; paint(); }
      });
    });
  });

  boot();
})();
</script>
</body>
</html>
